<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Learn Raku's icon: RA over KU, as on the Learn Raku app, in the
       site's ink and paper; light on dark when the system is dark. -->
  <style>
    rect { fill: #1e1c18; }
    text { fill: #fbf8f2; }
    @media (prefers-color-scheme: dark) {
      rect { fill: #ece8e1; }
      text { fill: #17161a; }
    }
  </style>
  <rect width="100" height="100" rx="22"/>
  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800"
     font-size="42" text-anchor="middle" letter-spacing="-0.8">
    <text x="50" y="46">RA</text>
    <text x="50" y="85">KU</text>
  </g>
</svg>
